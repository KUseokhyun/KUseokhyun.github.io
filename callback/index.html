<!DOCTYPE html>
<html>
<head>
    <title>AutoSentry 인증 중...</title>
    <script>
        window.onload = function() {
            // 현재 URL의 query parameter(code, state 등)를 가져옵니다.
            const urlParams = window.location.search;
            // 앱의 커스텀 스킴 주소로 이동합니다.
            const appSchemeUrl = "autosentry://callback" + urlParams;
            
            // 앱 실행 시도
            window.location.href = appSchemeUrl;

            // 만약 앱이 안 열릴 경우를 대비해 안내 문구 출력 (선택 사항)
            setTimeout(function() {
                document.body.innerHTML = "<h3>앱으로 이동 중입니다...</h3>" +
                    "<p>이동하지 않는다면 <a href='" + appSchemeUrl + "'>여기</a>를 클릭하세요.</p>";
            }, 500);
        };
    </script>
</head>
<body>
    인증을 완료하고 앱으로 돌아가는 중입니다...
</body>
</html>
